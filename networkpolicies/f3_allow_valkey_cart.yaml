---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: f3-allow-valkey-cart
  namespace: otel-demo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: cart

  policyTypes:
    - Egress

  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: valkey-cart
      ports:
        - protocol: TCP
          port: 6379
